
# Render assigns PORT dynamically — must use ${PORT}
server.port=${PORT:8080}

# Database - set SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD on Render
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/familyshield?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT - set FAMILYSHIELD_JWT_SECRET on Render
familyshield.jwt.secret=${FAMILYSHIELD_JWT_SECRET:FamilyShieldDefaultSecretKey-ChangeInProduction-2026!}
familyshield.jwt.expiration=86400000
familyshield.pairing.expiration-minutes=10
